name: Validate tap

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify cask matches the latest Translator release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-cask.mjs --check
      - name: Check Homebrew style
        run: |
          brew tap-new stage5/translator-ci
          cp Casks/stage5-translator.rb "$(brew --repository stage5/translator-ci)/Casks/"
          brew style --cask stage5/translator-ci/stage5-translator
